<div class="flex items-center justify-center min-h-screen" style="background-color: var(--tv-bg-dark);">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="shadow-2xl rounded-lg overflow-hidden border"
            style="background-color: var(--tv-bg-panel); border-color: var(--tv-border);">
            <!-- Header -->
            <div class="px-8 py-6 border-b"
                style="background: linear-gradient(to right, var(--tv-bg-hover), var(--tv-bg-panel)); border-color: var(--tv-border);">
                <div class="flex items-center justify-center mb-4">
                    <svg class="w-16 h-16 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-center" style="color: var(--tv-text-primary);">Investment Platform
                </h1>
                <p class="text-center mt-2" style="color: var(--tv-text-secondary);">Manage your mutual funds and stocks
                </p>
            </div>

            <!-- Body -->
            <div class="px-8 py-10">
                <h2 class="text-xl font-semibold mb-6 text-center" style="color: var(--tv-text-primary);">
                    Sign in to continue
                </h2>

                <!-- Loading State -->
                <div *ngIf="loading" class="flex justify-center py-8">
                    <app-loading-spinner size="md" [showText]="true" text="Loading sign-in..."></app-loading-spinner>
                </div>

                <!-- Error State -->
                <div *ngIf="!loading && error" class="bg-red-900/20 border border-red-800 rounded-md p-4 mb-4">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-sm text-red-300">{{ error }}</p>
                    </div>
                </div>

                <!-- Google Sign-In Button Container -->
                <div class="flex flex-col items-center space-y-4">
                    <div #googleButton class="w-full flex justify-center"
                        [style.display]="loading || error ? 'none' : 'flex'"></div>
                </div>
                <!-- Alternative: Custom styled button (fallback) -->
                <!-- Fallback button removed -->

                <!-- Info Text -->
                <div class="mt-8 text-center">
                    <p class="text-xs" style="color: var(--tv-text-muted);">
                        By signing in, you agree to our Terms of Service and Privacy Policy
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-8 py-4 border-t"
                style="background-color: var(--tv-bg-hover); border-color: var(--tv-border);">
                <p class="text-center text-xs" style="color: var(--tv-text-secondary);">
                    Secure authentication powered by Google
                </p>
            </div>
        </div>

        <!-- Additional Info -->
        <div class="mt-6 text-center">
            <p class="text-sm" style="color: var(--tv-text-muted);">
                Need help? <a href="#" class="hover:underline" style="color: var(--tv-blue);">Contact Support</a>
            </p>
        </div>
    </div>
</div>
