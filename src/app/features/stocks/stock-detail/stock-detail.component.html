  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center py-12">
    <app-loading-spinner size="lg" [showText]="true" text="Loading stock details..."></app-loading-spinner>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="bg-red-50 border border-red-200 rounded-md p-4 mb-6">
    <div class="flex">
      <div class="ml-3">
        <h3 class="text-sm font-medium text-red-800">Error loading stock details</h3>
        <div class="mt-2 text-sm text-red-700">
          <p>{{ error }}</p>
        </div>
        <div class="mt-4">
          <app-button variant="outline" size="sm" (clicked)="loadStockDetails()">
            Try Again
          </app-button>
        </div>
      </div>
    </div>
  </div>

        <dl class="space-y-4">
          <div *ngIf="stockInfo.description">
            <dt class="text-sm font-medium text-gray-500">Description</dt>
            <dd class="mt-1 text-sm text-gray-900">{{ stockInfo.description }}</dd>
