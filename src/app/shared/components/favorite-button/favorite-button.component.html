<button (click)="toggleFavorite($event)" [class]="'rounded transition-all duration-200 group ' + getButtonPadding()"
    [style.--hover-bg]="'var(--tv-bg-hover)'" style="background: transparent;"
    onmouseenter="this.style.background = 'var(--tv-bg-hover)'" onmouseleave="this.style.background = 'transparent'"
    [title]="isFavorite ? 'Remove from favorites' : 'Add to favorites'" [disabled]="isLoading"
    [attr.aria-label]="isFavorite ? 'Remove from favorites' : 'Add to favorites'" [attr.aria-pressed]="isFavorite"
    type="button">

    <!-- Filled Star (when favorited) -->
    <svg *ngIf="isFavorite && !isLoading" xmlns="http://www.w3.org/2000/svg"
        [class]="'transition-colors duration-200 star-filled ' + getSizeClass()" style="color: #FAA53D;"
        viewBox="0 0 24 24" fill="currentColor">
        <path
            d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
    </svg>

    <!-- Outline Star (when not favorited) -->
    <svg *ngIf="!isFavorite && !isLoading" xmlns="http://www.w3.org/2000/svg"
        [class]="'transition-colors duration-200 star-outline ' + getSizeClass()" style="color: var(--tv-text-muted);"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
    </svg>

    <!-- Loading Spinner -->
    <svg *ngIf="isLoading" [class]="'animate-spin ' + getSizeClass()" xmlns="http://www.w3.org/2000/svg"
        style="color: var(--tv-text-muted);" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
    </svg>
</button>
